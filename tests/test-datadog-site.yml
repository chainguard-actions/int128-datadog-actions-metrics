name: Test datadog-api-key and datadog-site inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          datadog-api-key: fake-api-key-for-testing
          datadog-site: datadoghq.eu
      - name: Assert action ran with datadog-api-key and datadog-site inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail because the API key is fake, but it should not
          # crash unexpectedly. Both success (unlikely) and failure (expected
          # with a fake key) are acceptable outcomes — what matters is that
          # the inputs were accepted and the action ran to completion.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with datadog-api-key and datadog-site inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
