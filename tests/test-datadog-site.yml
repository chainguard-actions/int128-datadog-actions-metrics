name: Test custom Datadog site (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "12345"
      GITHUB_RUN_NUMBER: "1"
      GITHUB_WORKFLOW: "Test Workflow"
      GITHUB_ACTOR: "test-actor"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key → dry-run mode; datadog-site is still accepted
          datadog-site: datadoghq.eu
      - name: Assert action completed with custom Datadog site in dry-run mode
        run: |
          echo "Action completed successfully with custom Datadog site in dry-run mode"
          echo "PASS"
