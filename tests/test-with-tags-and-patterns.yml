name: Test with datadog-tags and metrics-patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key → dry-run mode
          datadog-tags: |
            env:test
            team:platform
          metrics-patterns: |
            github.actions.*
          tag-key-patterns: |
            env
            team
      - name: Assert action completed with tags and patterns
        run: |
          echo "Action completed in dry-run mode with tags and patterns"
          echo "PASS"
