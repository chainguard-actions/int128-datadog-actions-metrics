name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in pull request event context
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          send-pull-request-labels: 'true'
      - name: Assert action completed successfully in PR context
        run: |
          echo "Action completed in pull_request event context in dry-run mode"
          echo "PASS"
