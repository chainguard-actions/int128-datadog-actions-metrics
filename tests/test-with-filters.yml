name: Test with metrics and tag-key patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          metrics-patterns: |
            github.actions.workflow_run.*
          tag-key-patterns: |
            repo
            branch
          # No datadog-api-key → dry-run mode
      - name: Assert action completed with filters in dry-run mode
        run: |
          echo "Action completed with metrics-patterns and tag-key-patterns in dry-run mode"
          echo "PASS"
