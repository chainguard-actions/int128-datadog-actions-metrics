name: Test custom tags and metrics patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with custom tags and metrics patterns
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key means dry-run mode
          datadog-tags: |
            env:test
            team:platform
          metrics-patterns: |
            github.actions.workflow_run.*
          tag-key-patterns: |
            env
            team
      - name: Assert action completed successfully
        run: |
          echo "Action completed with custom tags and metrics patterns in dry-run mode"
          echo "PASS: action ran without error"
