name: Test custom datadog-tags in dry-run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No datadog-api-key → dry-run mode; custom tags should be accepted without error
        with:
          github-token: ${{ github.token }}
          datadog-tags: |
            env:test
            team:platform
            project:ci-metrics
      - name: Assert action completed with custom tags in dry-run mode
        run: |
          echo "PASS: action accepted custom datadog-tags and completed in dry-run mode"
