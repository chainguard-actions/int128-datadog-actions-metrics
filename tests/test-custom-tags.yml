name: Test custom Datadog tags (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          datadog-tags: |
            env:test
            team:platform
          # No datadog-api-key → dry-run mode
      - name: Assert action completed with custom tags (dry-run)
        run: |
          echo "Action completed successfully with custom tags in dry-run mode"
          echo "PASS"
