name: Test dry-run with additional Datadog tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          datadog-tags: |
            env:test
            team:platform
      - name: Assert action completed with tags
        run: |
          echo "Action completed in dry-run mode with custom tags"
          echo "PASS"
