name: Test with additional Datadog tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key → dry-run mode
          datadog-tags: |
            env:test
            team:platform
            project:ci
      - name: Assert action ran with tags (dry-run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed in dry-run mode with custom tags"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo may cause API errors)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
