name: Test metrics patterns filter (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          metrics-patterns: |
            github.actions.workflow_run.*
          # No datadog-api-key → dry-run mode
      - name: Assert action completed with metrics patterns (dry-run)
        run: |
          echo "Action completed successfully with metrics patterns in dry-run mode"
          echo "PASS"
