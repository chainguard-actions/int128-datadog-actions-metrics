name: Test with metrics patterns filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          metrics-patterns: |
            github.actions.workflow_run.*
          tag-key-patterns: |
            repository
            workflow
        # No datadog-api-key → dry-run mode; action should complete without error
      - name: Assert action completed with metrics patterns
        run: |
          echo "Action completed in dry-run mode with metrics patterns"
          echo "PASS"
