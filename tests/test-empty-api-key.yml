name: Test explicit empty datadog-api-key falls back to dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          datadog-api-key: ''
          datadog-site: datadoghq.eu
      - name: Assert action succeeded in dry-run mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected an empty datadog-api-key to run in dry-run mode and succeed"
            exit 1
          fi
          echo "PASS"
