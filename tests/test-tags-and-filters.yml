name: Test dry-run with tags, filters and all boolean inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          datadog-site: datadoghq.eu
          datadog-tags: |
            team:platform
            env:test
          metrics-patterns: |
            github.actions.*
            !github.actions.api_rate_limit.used
          tag-key-patterns: |
            repository_*
            resource
          collect-job-metrics: 'true'
          collect-step-metrics: 'true'
          prefer-distribution-workflow-run-metrics: 'true'
          prefer-distribution-job-metrics: 'true'
          prefer-distribution-step-metrics: 'true'
          send-pull-request-labels: 'true'
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with all optional inputs set"
            exit 1
          fi
          echo "PASS"
