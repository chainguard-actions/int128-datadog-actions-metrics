name: Test distribution metrics mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with distribution metrics enabled in dry-run mode
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          github-token-rate-limit-metrics: ${{ github.token }}
          # No datadog-api-key means dry-run mode
          prefer-distribution-workflow-run-metrics: 'true'
          prefer-distribution-job-metrics: 'true'
          prefer-distribution-step-metrics: 'true'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with distribution metrics enabled in dry-run mode"
          echo "PASS: action ran without error"
