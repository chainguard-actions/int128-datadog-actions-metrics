name: Test distribution metrics preference options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "77777"
      GITHUB_RUN_NUMBER: "10"
      GITHUB_WORKFLOW: distribution-test-workflow
      GITHUB_SHA: 1234567890abcdef1234567890abcdef12345678
      GITHUB_ACTOR: test-actor
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with distribution metrics enabled (dry-run)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          prefer-distribution-workflow-run-metrics: 'true'
          prefer-distribution-job-metrics: 'true'
          prefer-distribution-step-metrics: 'true'
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with distribution metrics enabled"
          echo "PASS"
