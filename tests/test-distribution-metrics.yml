name: Test dry-run with distribution metrics preference
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          prefer-distribution-workflow-run-metrics: 'true'
          prefer-distribution-job-metrics: 'true'
          prefer-distribution-step-metrics: 'true'
      - name: Assert action completed with distribution metrics preference
        run: |
          echo "Action completed in dry-run mode with distribution metrics preference"
          echo "PASS"
