name: Test distribution metrics and metrics-patterns filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No datadog-api-key → dry-run mode
        # Test prefer-distribution-* flags and metrics-patterns filter
        with:
          github-token: ${{ github.token }}
          prefer-distribution-workflow-run-metrics: 'true'
          prefer-distribution-job-metrics: 'true'
          prefer-distribution-step-metrics: 'true'
          metrics-patterns: |
            github.actions.workflow_run.*
          tag-key-patterns: |
            workflow_name
            repository
      - name: Assert action completed with distribution metrics settings
        run: |
          echo "PASS: action accepted distribution metrics inputs and completed in dry-run mode"
