name: Test distribution metrics (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          prefer-distribution-workflow-run-metrics: 'true'
          prefer-distribution-job-metrics: 'true'
          prefer-distribution-step-metrics: 'true'
          # No datadog-api-key → dry-run mode
      - name: Assert action completed with distribution metrics (dry-run)
        run: |
          echo "Action completed successfully with distribution metrics in dry-run mode"
          echo "PASS"
