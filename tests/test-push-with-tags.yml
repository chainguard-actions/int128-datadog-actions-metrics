name: Test push event with custom tags (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key — runs in dry-run mode
          datadog-tags: |
            env:test
            team:platform
          metrics-patterns: |
            github.actions.*
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with custom tags in dry-run mode"
          echo "PASS"
