name: Test push event with datadog tags and metrics patterns
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "99999"
      GITHUB_RUN_NUMBER: "42"
      GITHUB_WORKFLOW: push-workflow
      GITHUB_SHA: deadbeef1234567890abcdef1234567890abcdef
      GITHUB_ACTOR: push-actor
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with tags and metrics patterns (dry-run)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          datadog-tags: |
            env:test
            team:platform
          metrics-patterns: |
            github.actions.workflow_run.*
          tag-key-patterns: |
            env
            team
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with tags and metrics patterns"
          echo "PASS"
