name: Test datadog-api-key and datadog-site inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          datadog-api-key: fake-api-key-for-testing
          datadog-site: datadoghq.eu
          collect-job-metrics: 'false'
          collect-step-metrics: 'false'
        continue-on-error: true
      - name: Assert action ran (with or without error due to fake key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with datadog-api-key and datadog-site inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
