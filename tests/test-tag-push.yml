name: Test tag push event dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          datadog-tags: |
            version:v1.0.0
          # No datadog-api-key → dry-run mode
      - name: Assert action completed for tag push event in dry-run mode
        run: |
          echo "Action completed for tag push event in dry-run mode"
          echo "PASS"
