name: Test rate limit metrics and PR labels (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          github-token-rate-limit-metrics: ${{ github.token }}
          # No datadog-api-key → dry-run mode
          send-pull-request-labels: 'false'
          datadog-tags: |
            service:ci
      - name: Assert action completed with rate limit token and PR label config
        run: |
          echo "Action completed with rate limit token and PR label settings in dry-run mode"
          echo "PASS"
