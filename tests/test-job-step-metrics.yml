name: Test job and step metrics collection (dry-run)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key → dry-run mode
          collect-job-metrics: 'true'
          collect-step-metrics: 'true'
      - name: Assert action completed with job and step metrics enabled
        run: |
          echo "Action completed with job and step metrics collection in dry-run mode"
          echo "PASS"
