name: Test tag-key-patterns input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          tag-key-patterns: |
            repository
            workflow
          datadog-tags: |
            env:test
      - name: Assert action completed successfully in dry-run mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success in dry-run mode but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action completed successfully with tag-key-patterns"
