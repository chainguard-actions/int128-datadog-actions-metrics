name: Test datadog site and pull request labels options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with datadog-site and send-pull-request-labels options
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key means dry-run mode
          datadog-site: datadoghq.eu
          send-pull-request-labels: 'true'
          datadog-tags: |
            region:eu
      - name: Assert action completed successfully
        run: |
          echo "Action completed with datadog-site and send-pull-request-labels options in dry-run mode"
          echo "PASS: action ran without error"
