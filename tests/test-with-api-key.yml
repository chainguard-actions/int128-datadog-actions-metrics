name: Test with Datadog API key provided
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          datadog-api-key: fake-api-key-for-testing
          datadog-site: datadoghq.com
          datadog-tags: |
            env:test
            source:act
          collect-job-metrics: 'false'
          collect-step-metrics: 'false'
      - name: Assert action ran (step was attempted with api key input)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed (dry-run or graceful error) or fail
          # with an auth error from Datadog. Either way, the step must have run.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with datadog-api-key input provided (outcome: ${{ steps.action.outcome }})"
