name: Test with datadog-api-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          datadog-api-key: fake-api-key-for-testing
          datadog-tags: |
            test:true
            env:ci

      - name: Assert action ran (input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (success or failure due to invalid key)
          # but must not be 'skipped' — that would mean it never executed
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with datadog-api-key input (outcome=$OUTCOME)"
