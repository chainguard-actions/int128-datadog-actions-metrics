name: Test basic dry-run (no Datadog API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key → dry-run mode
      - name: Assert action completed (dry-run)
        run: |
          echo "Action completed successfully in dry-run mode"
          echo "PASS"
