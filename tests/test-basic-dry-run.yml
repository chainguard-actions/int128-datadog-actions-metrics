name: Test basic dry-run (no Datadog API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No datadog-api-key → dry-run mode; action should succeed without sending metrics
        with:
          github-token: ${{ github.token }}
      - name: Assert action completed in dry-run mode
        run: |
          echo "PASS: action completed successfully in dry-run mode (no datadog-api-key)"
