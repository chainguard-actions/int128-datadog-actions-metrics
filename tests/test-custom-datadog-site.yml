name: Test custom Datadog site and API key inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          datadog-api-key: fake-api-key-for-testing-00000000000000000000000000000000
          datadog-site: datadoghq.eu
          collect-job-metrics: 'false'
          collect-step-metrics: 'false'
      - name: Assert action ran (step completed)
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action may fail to submit metrics with a fake key, but it should
          # have started and attempted to run. Both 'success' and 'failure' are
          # acceptable — what matters is that the inputs were accepted and the
          # action was invoked (not skipped or errored before starting).
          outcome="${{ steps.action.outcome }}"
          if [ "$outcome" = "success" ] || [ "$outcome" = "failure" ]; then
            echo "PASS: action ran with datadog-api-key and datadog-site inputs"
          else
            echo "FAIL: unexpected outcome: $outcome"
            exit 1
          fi
