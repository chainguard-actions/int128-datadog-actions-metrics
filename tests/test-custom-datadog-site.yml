name: Test custom Datadog site (dry-run without API key)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "55555"
      GITHUB_RUN_NUMBER: "7"
      GITHUB_WORKFLOW: site-test-workflow
      GITHUB_SHA: abcdef1234567890abcdef1234567890abcdef12
      GITHUB_ACTOR: test-actor
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with custom Datadog site (dry-run, no API key)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          datadog-site: datadoghq.eu
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with custom Datadog site"
          echo "PASS"
