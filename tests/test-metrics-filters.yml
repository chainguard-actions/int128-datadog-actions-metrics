name: Test dry-run with metrics and tag-key patterns filters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          metrics-patterns: |
            github.actions.workflow_run.*
          tag-key-patterns: |
            repository
            workflow
      - name: Assert action completed with metrics and tag-key filters
        run: |
          echo "Action completed in dry-run mode with metrics and tag-key pattern filters"
          echo "PASS"
