name: Test collect job and step metrics
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with job and step metrics collection enabled
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # No datadog-api-key means dry-run mode
          collect-job-metrics: 'true'
          collect-step-metrics: 'true'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with job and step metrics collection enabled in dry-run mode"
          echo "PASS: action ran without error"
