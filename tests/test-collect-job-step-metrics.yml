name: Test dry-run with job and step metrics collection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          collect-job-metrics: 'true'
          collect-step-metrics: 'true'
      - name: Assert action completed with job and step metrics enabled
        run: |
          echo "Action completed in dry-run mode with job and step metrics collection"
          echo "PASS"
